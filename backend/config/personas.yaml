# ==========================================
# GLOBAL SETTINGS
# ==========================================
settings:
  app_name: "Avatario"
  
  # LLM Configuration (can be overridden per persona)
  default_llm:
    model: ${VLLM_MODEL}
    base_url: ${VLLM_API_BASE}
    api_key: ${VLLM_API_KEY}
  
  # Voice Configuration
  default_stt:
    language: "unknown"  # Auto-detect
    model: "saaras:v3"
    mode: "transcribe"
    flush_signal: true
  
  default_tts:
    target_language_code: "en-IN"
    model: "bulbul:v3"
  
  # RAG/Knowledge Base Settings
  rag_enabled: true
  rag_endpoint: ${BRAIN_API_URL}
  rag_top_k: 3
